<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/styles.css"><style>html,body{width:100%;height:100%;margin:0;background:#0b0f14}#c{width:1100px;height:650px;position:relative}</style></head><body><div id="c"></div><script type="module">
import {ChartEngine} from '../src/chart.js';

const chart=new ChartEngine(document.querySelector('#c'),{symbol:'BTCUSDT',timeframe:'1h'});chart.setData(bars);chart.addIndicator('pro_harmonic_prz');chart.addIndicator('pro_pattern_breakout_radar');chart.addIndicator('pro_order_block_mitigation');chart.addIndicator('pro_demand_supply_zone_engine');chart.addIndicator('pro_weighted_curve_channel');chart.addIndicator('pro_institutional_imbalance_pressure');chart.addIndicator('pro_compression_expansion_regime');chart.addIndicator('pro_rolling_volume_profile');chart.draw();document.body.dataset.ok='1';
</script></body></html>
