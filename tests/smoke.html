<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/styles.css"><style>html,body{width:100%;height:100%;margin:0;background:#0b0f14}#c{width:900px;height:520px;position:relative}.ok{position:absolute;z-index:9;right:10px;top:10px;padding:8px;background:#10161d;color:white}</style></head><body><div id="c"></div><div id="result" class="ok">RUNNING</div><script type="module">
import {ChartEngine} from '../src/chart.js';import {ScriptEngine} from '../src/scripts.js';import {runBacktest} from '../src/backtest.js';
const bars=[];let p=60000;for(let i=0;i<700;i++){const o=p,c=o+(Math.sin(i/11)*110)+(i%7-3)*18,h=Math.max(o,c)+80,l=Math.min(o,c)-75;bars.push({time:Date.now()-(700-i)*3600000,open:o,high:h,low:l,close:c,volume:100+i%30});p=c}
const chart=new ChartEngine(document.querySelector('#c'),{symbol:'BTCUSDT',timeframe:'1h'});chart.setData(bars);chart.addIndicator('ema');chart.addIndicator('bollinger');chart.addIndicator('rsi');chart.addIndicator('macd');chart.drawings.items=[{id:'a',type:'fib',points:[{index:580,time:bars[580].time,price:bars[580].low},{index:650,time:bars[650].time,price:bars[650].high}]}];
const engine=new ScriptEngine();const script={name:'t',type:'strategy',source:`defineStrategy({name:'T',inputs:{},run({close,ta,strategy}){const a=ta.ema(close,10),b=ta.ema(close,30);for(let i=1;i<close.length-1;i++){if(ta.crossover(a,b,i))strategy.entry(i,'long',{stopPct:1,takePct:2});if(ta.crossunder(a,b,i))strategy.close(i)}}});`};
try{const out=await engine.run(script,bars);const bt=runBacktest(bars,out.orders,{});chart.setMarkers(bt.trades.flatMap(t=>[{index:t.entryIndex,side:t.side,label:'E'},{index:t.exitIndex,side:'sell',label:'X'}]));document.querySelector('#result').textContent=`OK bars=${bars.length} orders=${out.orders.length} trades=${bt.totalTrades}`;document.querySelector('#result').dataset.ok='1'}catch(e){document.querySelector('#result').textContent='FAIL '+e.message;document.querySelector('#result').dataset.ok='0'}
</script></body></html>
